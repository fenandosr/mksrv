name: base
title: Base edge
description: "Podman runtime, Caddy, cloudflared, and perimeter firewall"
targets: [cloud]
per_tenant: false
depends_on: []
apps:
  - name: caddy
    image: docker.io/library/caddy:2.8
  - name: cloudflared
    image: docker.io/cloudflare/cloudflared:2025.2.1
networks: [mksrv-base]
secrets: []
tailnet_ports: []
resources:
  min_ram_mb: 512
  disk_gb: 5
templates:
  - src: templates/mksrv-base.network.tmpl
    dst: /etc/containers/systemd/mksrv-base.network
    scope: shared
  - src: templates/caddy.d-keep.tmpl
    dst: /var/lib/mksrv/caddy.d/.keep
    scope: shared
  - src: templates/caddy.container.tmpl
    dst: /etc/containers/systemd/mksrv-caddy.container
    scope: shared
  - src: templates/Caddyfile.tmpl
    dst: /var/lib/mksrv/stacks/base/Caddyfile
    scope: shared
health:
  - app: caddy
    type: http
    path: /healthz
    port: 80
