name: files
title: Files
description: "Nextcloud and Samba file services, one instance per tenant"
targets: [cloud, local]
per_tenant: true
depends_on: [database, identity]
apps:
  - name: nextcloud
    image: docker.io/library/nextcloud:30-apache
  - name: samba
    image: ghcr.io/servercontainers/samba:a3.24.2-s4.23.8-r0
networks: [mksrv-files]
secrets: []
tailnet_ports: [8030, 4450]
resources:
  min_ram_mb: 640
  disk_gb: 50
templates:
  - src: templates/mksrv-files.network.tmpl
    dst: /etc/containers/systemd/mksrv-files.network
    scope: shared
  - src: templates/nextcloud.container.tmpl
    dst: "/etc/containers/systemd/mksrv-nextcloud-{tenant}.container"
    scope: per_tenant
  - src: templates/samba.container.tmpl
    dst: "/etc/containers/systemd/mksrv-samba-{tenant}.container"
    scope: per_tenant
health: []
