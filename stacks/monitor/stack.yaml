name: monitor
title: Monitoring
description: "Prometheus, Grafana, Alertmanager, node-exporter, and cAdvisor"
targets: [cloud, local]
per_tenant: true
depends_on: [identity]
apps:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v3.1.0
  - name: grafana
    image: docker.io/grafana/grafana:11.5.1
  - name: alertmanager
    image: quay.io/prometheus/alertmanager:v0.28.0
  - name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.8.2
  - name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.2
networks: [mksrv-monitor]
secrets:
  - /mksrv/{env}/monitor/grafana_admin_password
tailnet_ports: [9090, 3000, 9093, 9100, 8080]
resources:
  min_ram_mb: 2048
  disk_gb: 30
templates: []
health:
  - app: prometheus
    type: http
    path: /-/ready
    port: 9090
  - app: grafana
    type: http
    path: /api/health
    port: 3000
