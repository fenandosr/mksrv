name: monitor
title: Monitoring
description: "Prometheus and Grafana, scraping the fleet's `agent` stack plus per-service exporters"
targets: [cloud, local]
per_tenant: true
depends_on: [identity, agent]
apps:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v3.1.0
  - name: grafana
    image: docker.io/grafana/grafana:11.5.1
  - name: blackbox
    image: quay.io/prometheus/blackbox-exporter:v0.25.0
networks: [mksrv-monitor]
secrets:
  - /mksrv/{env}/monitor/grafana_admin_password
tailnet_ports: [9090, 3000]
resources:
  min_ram_mb: 1056
  disk_gb: 20
storage:
  - name: tsdb
    gb: 8
    grows_with: metrics
    from: mksrv-monitor-prometheus
    unit: mksrv-prometheus.service
templates:
  - src: templates/mksrv-monitor.network.tmpl
    dst: /etc/containers/systemd/mksrv-monitor.network
    scope: shared
  - src: templates/prometheus.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/prometheus.yml
    scope: shared
  - src: templates/prometheus-rules.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/prometheus-rules.yml
    scope: shared
  - src: templates/prometheus.container.tmpl
    dst: /etc/containers/systemd/mksrv-prometheus.container
    scope: shared
  - src: templates/grafana-datasource.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/grafana-datasource.yml
    scope: shared
  - src: templates/grafana-dashboards.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/grafana-dashboards.yml
    scope: shared
  - src: templates/dashboards/fleet-overview.json.tmpl
    dst: /var/lib/mksrv/stacks/monitor/dashboards/fleet-overview.json
    scope: shared
  - src: templates/blackbox.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/blackbox.yml
    scope: shared
  - src: templates/blackbox.container.tmpl
    dst: /etc/containers/systemd/mksrv-blackbox.container
    scope: shared
  - src: templates/grafana.container.tmpl
    dst: /etc/containers/systemd/mksrv-grafana.container
    scope: shared
  - src: templates/monitor.caddy.tmpl
    dst: /var/lib/mksrv/caddy.d/30-monitor.caddy
    scope: shared
hooks:
  post_deploy:
    - run: hooks/reload-prometheus.sh
      scope: shared
health:
  - app: prometheus
    type: http
    path: /-/ready
    port: 9090
  - app: grafana
    type: http
    path: /api/health
    port: 3000
  - app: blackbox
    type: http
    path: /
    port: 9115
