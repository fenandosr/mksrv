name: monitor
title: Monitoring
description: "Prometheus, Grafana, node-exporter, and cAdvisor"
targets: [cloud, local]
per_tenant: true
depends_on: [identity]
apps:
  - name: prometheus
    image: quay.io/prometheus/prometheus:v3.1.0
  - name: grafana
    image: docker.io/grafana/grafana:11.5.1
  - name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.8.2
  - name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.2
networks: [mksrv-monitor]
secrets:
  - /mksrv/{env}/monitor/grafana_admin_password
tailnet_ports: [9090, 3000, 9100, 8080]
resources:
  min_ram_mb: 1024
  disk_gb: 20
storage:
  - name: tsdb
    gb: 8
    grows_with: metrics
    from: mksrv-monitor-prometheus
    unit: mksrv-prometheus.service
templates:
  - src: templates/mksrv-monitor.network.tmpl
    dst: /etc/containers/systemd/mksrv-monitor.network
    scope: shared
  - src: templates/prometheus.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/prometheus.yml
    scope: shared
  - src: templates/node-exporter.container.tmpl
    dst: /etc/containers/systemd/mksrv-node-exporter.container
    scope: shared
  - src: templates/cadvisor.container.tmpl
    dst: /etc/containers/systemd/mksrv-cadvisor.container
    scope: shared
  - src: templates/prometheus.container.tmpl
    dst: /etc/containers/systemd/mksrv-prometheus.container
    scope: shared
  - src: templates/grafana-datasource.yml.tmpl
    dst: /var/lib/mksrv/stacks/monitor/grafana-datasource.yml
    scope: shared
  - src: templates/grafana.container.tmpl
    dst: /etc/containers/systemd/mksrv-grafana.container
    scope: shared
  - src: templates/monitor.caddy.tmpl
    dst: /var/lib/mksrv/caddy.d/30-monitor.caddy
    scope: shared
health:
  - app: prometheus
    type: http
    path: /-/ready
    port: 9090
  - app: grafana
    type: http
    path: /api/health
    port: 3000
