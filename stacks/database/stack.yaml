name: database
title: Database
description: "PostgreSQL 16 with per-tenant databases, roles, and RLS, plus pgAdmin"
targets: [cloud, local]
per_tenant: true
depends_on: [identity]
apps:
  - name: postgres
    image: docker.io/library/postgres:16
  - name: pgadmin
    image: docker.io/dpage/pgadmin4:8
  - name: postgrest
    image: docker.io/postgrest/postgrest:v12.2.3
networks: [mksrv-database]
secrets:
  - /mksrv/{env}/database/pg_superpass
  - /mksrv/{env}/database/pgadmin_pass
tailnet_ports: [5432, 5050, 3010]
resources:
  min_ram_mb: 1024
  disk_gb: 20
templates:
  - src: templates/mksrv-database.network.tmpl
    dst: /etc/containers/systemd/mksrv-database.network
    scope: shared
  - src: templates/postgres.container.tmpl
    dst: /etc/containers/systemd/mksrv-postgres.container
    scope: shared
  - src: templates/pgadmin.container.tmpl
    dst: /etc/containers/systemd/mksrv-pgadmin.container
    scope: shared
  - src: templates/database.caddy.tmpl
    dst: /var/lib/mksrv/caddy.d/20-database.caddy
    scope: shared
  - src: templates/postgrest.container.tmpl
    dst: /etc/containers/systemd/mksrv-postgrest-{tenant}.container
    scope: per_tenant
health:
  - app: postgres
    type: tcp
    port: 5432
  - app: pgadmin
    type: http
    path: /misc/ping
    port: 5050
