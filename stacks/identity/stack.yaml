name: identity
title: Identity and mesh
description: "Headscale, one Keycloak instance with its own Postgres, and configd"
targets: [cloud]
per_tenant: true
depends_on: [base]
apps:
  - name: postgres
    image: docker.io/library/postgres:16
  - name: headscale
    image: ghcr.io/juanfont/headscale:0.26.0
  - name: keycloak
    image: quay.io/keycloak/keycloak:26.1
  - name: configd
    image: ghcr.io/fenandosr/mksrv-configd:latest
networks: [mksrv-identity]
secrets:
  - /mksrv/{env}/identity/kc_db_password
  - /mksrv/{env}/identity/keycloak_admin_password
tailnet_ports: [8080, 9090]
resources:
  min_ram_mb: 2048
  disk_gb: 10
templates:
  - src: templates/mksrv-identity.network.tmpl
    dst: /etc/containers/systemd/mksrv-identity.network
    scope: shared
  - src: templates/postgres-kc.container.tmpl
    dst: /etc/containers/systemd/mksrv-identity-postgres.container
    scope: shared
  - src: templates/headscale-config.yaml.tmpl
    dst: /var/lib/mksrv/stacks/identity/headscale/config.yaml
    scope: shared
  - src: templates/headscale.container.tmpl
    dst: /etc/containers/systemd/mksrv-headscale.container
    scope: shared
  - src: templates/keycloak.container.tmpl
    dst: /etc/containers/systemd/mksrv-keycloak.container
    scope: shared
  - src: templates/identity.caddy.tmpl
    dst: /var/lib/mksrv/caddy.d/10-identity.caddy
    scope: shared
hooks:
  post_deploy:
    - run: hooks/reload-caddy.sh
      scope: shared
health:
  - app: headscale
    type: http
    path: /health
    port: 8081
  - app: keycloak
    type: http
    path: /health/ready
    port: 9000
