name: mail
title: Mail
description: "Shared inbound+outbound mail server (docker-mailserver) for tenants that opt in via a mail: block (ADR 0032)"
targets: [cloud]
per_tenant: false
depends_on: [base]
apps:
  - name: mailserver
    image: docker.io/mailserver/docker-mailserver:14.0
networks: [mksrv-mail]
secrets: []
storage:
  - name: maildata
    gb: 20
templates:
  - src: templates/mksrv-mail.network.tmpl
    dst: /etc/containers/systemd/mksrv-mail.network
    scope: shared
  - src: templates/mailserver.container.tmpl
    dst: /etc/containers/systemd/mksrv-mailserver.container
    scope: shared
  - src: templates/mail.caddy.tmpl
    dst: /var/lib/mksrv/caddy.d/15-mail.caddy
    scope: shared
  # The Quadlet unit above bind-mounts these five directories; Podman doesn't
  # create a missing bind-mount source itself (fails the container start with
  # "statfs ...: no such file or directory" on a fresh host/volume), so they
  # need to exist before the deploy loop restarts the unit. DeployStack's
  # write path `mkdir -p`s the parent of whatever it writes — these are here
  # purely so that happens for directories no other template ever writes into
  # (mail's own config/TLS are populated later, by `mksrv tenant apply`'s SSH
  # writes, not by this stack's own templates; docker-mailserver owns the
  # maildata subdirectories' actual content).
  - src: templates/keep.tmpl
    dst: /var/lib/mksrv/stacks/mail/config/.keep
    scope: shared
  - src: templates/keep.tmpl
    dst: /var/lib/mksrv/stacks/mail/tls/.keep
    scope: shared
  - src: templates/keep.tmpl
    dst: /var/lib/mksrv/vol/maildata/mail-data/.keep
    scope: shared
  - src: templates/keep.tmpl
    dst: /var/lib/mksrv/vol/maildata/mail-state/.keep
    scope: shared
  - src: templates/keep.tmpl
    dst: /var/lib/mksrv/vol/maildata/mail-logs/.keep
    scope: shared
resources:
  min_ram_mb: 1024
  disk_gb: 20
# Not a `tcp`/993 check: docker-mailserver refuses to start Dovecot (so
# nothing ever binds :993) until at least one mailbox exists in
# postfix-accounts.cf — which `mksrv tenant apply` writes, *after* this
# deploy. A `tcp` check here would retry for its full ~5 minutes and then
# hard-fail every first deploy on a host with no mailboxes provisioned yet
# (confirmed live). `command` is the existing no-op escape hatch
# (runHealthCheck's `case "command": return nil`) for a stack whose health
# genuinely can't be checked at deploy time; the container's own Quadlet
# HealthCmd (`ss ... :993`) still tracks real health continuously —
# `podman ps` / `systemctl status mksrv-mailserver.service` show it.
health:
  - app: mailserver
    type: command
